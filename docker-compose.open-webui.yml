services:
  open-webui:
    build:
      context: ./frontend/open-webui
      dockerfile: Dockerfile
    container_name: geoq-open-webui
    ports:
      - "3000:8080"
    environment:
      WEBUI_NAME: Geoq
      WEBUI_URL: http://localhost:3000
      OPENAI_API_BASE_URLS: http://geoq:8001/v1
      OPENAI_API_KEYS: geoq-local
      ENABLE_OPENAI_API: "true"
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - geoq
    restart: unless-stopped

volumes:
  open_webui_data:
