version: "3.8"

services:
  backend:
    build: .
    container_name: qeshm-ai-backend
    command: sh -c "cd /app/api && uvicorn app:app --host 0.0.0.0 --port 8001"
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    ports:
      - "8001:8001"
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - 'REDIS_URL=redis://redis:6379/0'

  redis:
    image: redis:latest
    container_name: my-redis-instance
    ports:
      - "6379:6379" 
    volumes:
      - redis_data:/data 

volumes:
  redis_data:
