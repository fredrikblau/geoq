name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The current test suite is intentionally dependency-light. Installing
      # the optional AI stack here would download CUDA/model packages just to
      # run repository, data, and text contract checks.
      # Contract tests exercise FastAPI through its in-process HTTP client while
      # keeping the optional AI/model dependency stack out of the CI job.
      - run: python -m pip install pytest==8.4.2 fastapi==0.120.2 httpx==0.28.1
      - run: python -m pytest
      - run: python -m compileall api
